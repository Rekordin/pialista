<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14090A">
<title>Пиалиста</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#14090A;--panel:#1D0F11;--panel2:#2A1416;--line:#4A252A;--ink:#F3E3C3;--paper:#FBF7EE;--muted:#B8A78C;--gold:#D9A23F;--red:#E5122B;--red2:#A3000F;
--tg-top:calc(var(--tg-safe-area-inset-top,env(safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px));
--tg-bottom:calc(var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px)) + var(--tg-content-safe-area-inset-bottom,0px));
--tg-left:var(--tg-safe-area-inset-left,env(safe-area-inset-left,0px));--tg-right:var(--tg-safe-area-inset-right,env(safe-area-inset-right,0px))}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Inter,Arial,Helvetica,sans-serif;overscroll-behavior:none;padding-left:var(--tg-left);padding-right:var(--tg-right);min-height:var(--tg-viewport-stable-height,100vh)}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--gold)}
.mono{font-family:"Rubik Mono One",Inter,Arial,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0}

/* шапка */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:var(--tg-top);background:var(--bg);z-index:49;pointer-events:none}
.top{position:sticky;top:var(--tg-top);z-index:30;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;height:56px;max-width:620px;margin:0 auto;padding:0 16px}
.logo{width:38px;height:38px;border:2px solid var(--gold);overflow:hidden;flex:none;background:#f0dec0}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.7);transform-origin:center 34%;display:block}
.ttl{min-width:0;flex:1;line-height:1.1}
.ttl b{display:block;font-size:15px}
.ttl small{display:block;margin-top:5px;font-size:9px;font-weight:600;letter-spacing:.24em;color:var(--muted)}
.me-chip{flex:none;border:2px solid var(--gold);color:var(--gold);padding:6px 10px;font-size:11px;font-weight:600;letter-spacing:.1em;white-space:nowrap;background:transparent}

.main{max-width:620px;margin:0 auto;padding:16px 16px calc(92px + var(--tg-bottom))}

/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:2px solid var(--line);padding-bottom:var(--tg-bottom);padding-left:var(--tg-left);padding-right:var(--tg-right)}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:620px;margin:0 auto}
.nav button{background:transparent;border:0;border-top:4px solid transparent;border-right:1px solid var(--line);color:var(--muted);height:58px;padding:0 2px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.nav button:last-child{border-right:0}
.nav button.on{color:var(--paper);border-top-color:var(--red)}

/* блоки */
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--red);flex:none}
h1{font-size:clamp(22px,6.4vw,30px);line-height:1.15;margin:10px 0 8px}
.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.banner{border:2px solid var(--line);border-left:6px solid var(--gold);background:var(--panel);padding:14px;margin-bottom:16px;font-size:14px}
.banner.err{border-left-color:var(--red)}
.banner b{display:block;margin-bottom:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.banner p{color:var(--ink)}
.banner small{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.cta{display:block;width:100%;margin-top:12px;min-height:50px;border:2px solid var(--red);background:var(--red2);color:var(--paper);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.cta.ghost{background:transparent;border-color:var(--line);color:var(--ink)}

.chips{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;border:2px solid var(--line);background:transparent;color:var(--muted);padding:9px 7px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tzline{font-size:11px;color:var(--muted);margin:-4px 0 14px;letter-spacing:.04em}
.day{margin:22px 0 10px;display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.day::after{content:"";flex:1;height:2px;background:var(--line)}
.day:first-child{margin-top:4px}
.empty{border:2px dashed var(--line);padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);margin:6px 0 16px}

/* карточка матча */
.m{background:var(--panel);border:2px solid var(--line);margin-bottom:14px}
.m.open{border-left:6px solid var(--red2)}
.m.locked{border-left:6px solid var(--gold)}
.m.dim{opacity:.8}
.m-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.m-h .stg{color:var(--gold)}
.m-h .x2{color:var(--paper);background:var(--red2);padding:1px 6px;margin-left:8px;letter-spacing:.06em}
.m-t{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;padding:16px 14px}
.tm{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.bdg{width:46px;height:46px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font:12px "Rubik Mono One",Inter,sans-serif;color:var(--gold);overflow:hidden}
.bdg img{width:100%;height:100%;object-fit:cover;display:block}
.tm b{font-size:14px;line-height:1.2;overflow-wrap:anywhere;font-weight:600}
.tm small{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.vs{font:12px "Rubik Mono One",Inter,sans-serif;color:var(--muted)}
.sc{font:28px/1 "Rubik Mono One",Inter,sans-serif;color:var(--paper);white-space:nowrap;text-align:center}
.sc i{font-style:normal;color:var(--red);padding:0 4px}
.sc small{display:block;margin-top:8px;font:600 10px Inter,sans-serif;letter-spacing:.12em;color:var(--muted)}
.pk{padding:0 14px 14px;display:grid;gap:8px}
.lbl{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.lbl em{font-style:normal;color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button,.num button{min-height:48px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:15px}
.num{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.num button{min-height:42px;font-size:14px}
.seg button.on,.num button.on{background:var(--red2);border-color:var(--red);color:var(--paper)}
.m-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-height:40px}
.m-f .sv{font-weight:600;color:var(--gold);white-space:nowrap}
.m-f .sv.bad{color:var(--red)}
.m-f .cd{min-width:0}
.res{padding:0 14px 12px;text-align:center;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.my{margin:0 14px 14px;border:2px solid var(--line);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.my .lab{font-size:10px;font-weight:600;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;width:100%}
.my .tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{border:2px solid var(--line);padding:4px 9px;font-weight:600;font-size:13px}
.tag.ok{border-color:var(--gold);color:var(--gold)}
.tag.no{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.pts{font:18px "Rubik Mono One",Inter,sans-serif;color:var(--muted)}
.pts.win{color:var(--gold)}
.crowd{margin:0 14px 14px}
.bar{display:flex;height:10px;border:2px solid var(--line);background:var(--bg)}
.bar i{display:block;height:100%}
.bar .h{background:var(--red2)}.bar .d{background:var(--gold)}.bar .a{background:var(--ink)}
.cl{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11px;color:var(--muted);flex-wrap:wrap}

/* история и расписание */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:2px solid var(--line);background:var(--panel);margin-bottom:10px}
.sum>div{padding:14px;display:flex;flex-direction:column;gap:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.sum>div:nth-child(2n){border-right:0}
.sum>div:nth-child(n+3){border-bottom:0}
.sum b{font-size:26px;line-height:1;color:var(--paper)}
.sum span{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hx-t{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:14px;text-align:center}
.hx-t b{font-size:14px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}
.hx-t b:only-child{grid-column:1/-1}
.sc.sm{font-size:22px}
.lnk{flex:none;border:2px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.sgrp{border:2px solid var(--line);background:var(--panel)}
.sgrp>:last-child{border-bottom:0}
.sr{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:inherit;padding:11px 12px;font:inherit}
.sr-t{font:600 13px Inter,sans-serif;color:var(--gold);letter-spacing:.04em}
.sr-n{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.sr-n b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.sr-n i{font-style:normal;color:var(--muted)}
.sr-n .mu{color:var(--muted);font-weight:400}
.sr-m{min-width:0}
.sr-m small{display:block;margin-top:3px;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sr-s{max-width:84px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.sr-s.ok{color:var(--gold)}
.sr-s.todo{color:var(--red)}
.sr-sc{font:16px "Rubik Mono One",Inter,sans-serif;color:var(--paper);text-align:right;white-space:nowrap}
.sr-sc small{display:block;margin-top:5px;font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--gold)}
button.sr{cursor:pointer}

/* таблица лидеров */
.board{list-style:none;border:2px solid var(--line);background:var(--panel)}
.lb{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:12px 14px 12px 8px;border-bottom:1px solid var(--line);border-left:6px solid transparent}
.lb:last-child{border-bottom:0}
.lb .rk{font:15px "Rubik Mono One",Inter,sans-serif;color:var(--muted)}
.lb.top3 .rk{color:var(--gold)}
.lb .nm{min-width:0}
.lb .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.lb .nm small{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.lb .pt{font:18px "Rubik Mono One",Inter,sans-serif;color:var(--paper)}
.lb.me{background:var(--panel2);border-left-color:var(--red)}
.mecard{border:2px solid var(--line);border-left:6px solid var(--red);background:var(--panel);padding:14px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
.mecard .big{grid-row:span 2;font:34px/1 "Rubik Mono One",Inter,sans-serif;color:var(--paper)}
.mecard .big small{display:block;margin-top:6px;font:600 10px Inter,sans-serif;letter-spacing:.14em;color:var(--muted)}
.mecard span{font-size:13px;color:var(--muted)}

/* правила */
.rules{display:grid;gap:12px}
.card{border:2px solid var(--line);background:var(--panel);padding:14px}
.card h2{font-size:13px;margin-bottom:10px;color:var(--gold)}
.card p,.card li{font-size:14px;color:var(--ink)}
.card ul{list-style:none;display:grid;gap:8px}
.card li{padding-left:16px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--red)}
.pt-table{width:100%;border-collapse:collapse;font-size:14px}
.pt-table td{padding:9px 0;border-bottom:1px solid var(--line)}
.pt-table tr:last-child td{border-bottom:0}
.pt-table td:last-child{text-align:right;font:600 15px Inter,sans-serif;color:var(--gold)}

/* уведомление */
.toast{position:fixed;left:50%;bottom:calc(76px + var(--tg-bottom));transform:translateX(-50%);z-index:60;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;font-size:13px;font-weight:600;border:2px solid var(--bg)}
.toast.err{background:var(--red2);color:var(--paper);border-color:var(--red)}
.loading{padding:40px 0;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.08em}
</style>
</head>

}

// ---------- турнирная логика (перенесена из сайта статистики) ----------
function baseRows(D,teams,matches){return teams.map(team=>{let w=0,dr=0,l=0,gf=0,ga=0;for(const m of matches.filter(x=>x.status==="played"&&(x.home===team.id||x.away===team.id))){const a=(m.home===team.id?m.hg:m.ag)??0,b=(m.home===team.id?m.ag:m.hg)??0;gf+=a;ga+=b;if(a>b)w++;else if(a<b)l++;else dr++}return{team,played:w+dr+l,w,d:dr,l,gf,ga,gd:gf-ga,pts:w*3+dr}})}
const primary=(a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf;
function standings(D,g){
  const matches=D.matches.filter(m=>m.stage==="group"&&m.group===g);
  if(matches.every(m=>m.status!=="played"))return baseRows(D,D.teams.filter(t=>t.group===g),matches);
  const rows=baseRows(D,D.teams.filter(t=>t.group===g),matches).sort(primary),out=[];
  for(let i=0;i<rows.length;){
    let j=i+1;while(j<rows.length&&!primary(rows[i],rows[j]))j++;
    const tied=rows.slice(i,j);
    if(tied.length>1){
      const ids=new Set(tied.map(r=>r.team.id));
      const h=baseRows(D,tied.map(r=>r.team),matches.filter(m=>ids.has(m.home)&&ids.has(m.away)));
      const look=new Map(h.map(r=>[r.team.id,r]));
      tied.sort((a,b)=>primary(look.get(a.team.id),look.get(b.team.id))||a.team.id.localeCompare(b.team.id,undefined,{numeric:true}));
      tied.forEach(a=>a.unresolved=tied.some(b=>b!==a&&!primary(look.get(a.team.id),look.get(b.team.id))));
    }
    out.push(...tied);i=j;
  }
  return out;
}
const thirdRows=D=>GROUPS.map(g=>standings(D,g)[2]).filter(Boolean).sort((a,b)=>primary(a,b)||a.team.group.localeCompare(b.team.group));
const groupsComplete=D=>GROUPS.every(g=>{const t=D.teams.filter(x=>x.group===g),m=D.matches.filter(x=>x.stage==="group"&&x.group===g);return t.length===4&&m.length===6&&m.every(x=>x.status==="played")});
function resolve(D,src,depth=0){
  if(!src||depth>12)return null;
  if(src.startsWith("team:"))return D.teams.some(t=>t.id===src.slice(5))?src.slice(5):null;
  if(src.startsWith("g:")){if(!groupsComplete(D))return null;const[,g,p]=src.split(":"),row=standings(D,g)[Number(p)-1];return row&&!row.unresolved?row.team.id:null}
  if(src.startsWith("third:")){if(!groupsComplete(D))return null;const rows=thirdRows(D),i=Number(src.split(":")[1])-1,row=rows[i];if(!row||row.unresolved||rows.some((r,j)=>j!==i&&!primary(row,r)))return null;return row.team.id}
  if(src.startsWith("winner:"))return tieResult(D,src.slice(7),depth+1).winner;
  return null;
}
function tieResult(D,id,depth=0){
  const t=D.ties.find(x=>x.id===id);
  if(!t||depth>12)return{winner:null};
  const home=resolve(D,t.home,depth+1),away=resolve(D,t.away,depth+1);
  const legs=D.matches.filter(m=>m.tie===id).sort((a,b)=>a.leg-b.leg);
  const done=legs.length===2&&legs.every(m=>m.status==="played");
  const hs=legs.reduce((n,m)=>n+(m.status==="played"?(m.leg===1?m.hg:m.ag)||0:0),0),as=legs.reduce((n,m)=>n+(m.status==="played"?(m.leg===1?m.ag:m.hg)||0:0),0);
  let winner=null;
  if(done&&home&&away){if(hs!==as)winner=hs>as?home:away;else{const s=legs[1];if(s.hp!=null&&s.ap!=null&&s.hp!==s.ap)winner=s.hp>s.ap?away:home}}
  return{winner};
}
function matchTeams(D,m){
  if(m.stage==="group")return[m.home||null,m.away||null];
  const t=D.ties.find(x=>x.id===m.tie);
  if(!t)return[null,null];
  const h=resolve(D,t.home),a=resolve(D,t.away);
  return m.leg===1?[h,a]:[a,h];
}

function applySchedule(s){
  sched=s;offset=s.now-Date.now();if(Number.isFinite(s.lock_hours))lockH=s.lock_hours;
  const D={teams:s.teams,matches:s.matches,ties:s.ties};
  tmap=new Map(s.teams.map(t=>[t.id,t]));tiemap=new Map(s.ties.map(t=>[t.id,t]));
  list=s.matches.map(m=>{
    let h=null,a=null;
    try{[h,a]=matchTeams(D,m)}catch{}
    const ts=m.date?Date.parse(m.date):NaN;
    return{...m,h,a,ts:Number.isFinite(ts)?ts:null};
  });
}
function applyOverview(o){
  offset=o.now-Date.now();if(Number.isFinite(o.lock_hours))lockH=o.lock_hours;
  ov={...o};
  for(const k of Object.keys(status))if(status[k]==="bad")delete status[k];

function stateOf(m){

  if(!m.h||!m.a)return "tbd";
  if(m.ts===null)return "nodate";
  const n=nowMs();
  if(m.ts<=n)return "live";
  if(m.ts-lockMs()<=n)return "locked";
  return "open";
}

function badge(id){
  const t=tmap.get(id);if(!t)return `<span class="bdg">?</span>`;

function scheduleHtml(){
  const items=list.map(m=>({m,st:stateOf(m)}));
  const dated=items.filter(x=>x.m.ts!==null).sort((a,b)=>a.m.ts-b.m.ts||String(a.m.id).localeCompare(String(b.m.id)));
  const nodate=items.filter(x=>x.m.ts===null&&x.st==="nodate");
  const tbd=items.filter(x=>x.m.ts===null&&x.st!=="nodate").length;
  if(!dated.length&&!nodate.length&&!tbd)return `<div class="empty">Расписание пока пустое. Организатор добавит матчи на сайте турнира.</div>`;
  let html=`<div class="tzline">Время указано по вашему часовому поясу (${tzLabel()})</div>`,key="",rows="";
  const flush=()=>{if(rows)html+=`<div class="sgrp">${rows}</div>`;rows=""};
  for(const {m,st} of dated){
    const k=dayKey(m.ts);
    if(k!==key){flush();html+=`<div class="day">${esc(fmtDay(m.ts))}</div>`;key=k}
    rows+=rowHtml(m,st);
  }
  flush();
  if(nodate.length){html+=`<div class="day">Время уточняется</div><div class="sgrp">${nodate.map(x=>rowHtml(x.m,x.st)).join("")}</div>`}

}
function histRow(m,st){

  return `<article class="m" data-st="${st}">

  <div class="res">${esc(res)}</div>${myHtml(m,st)}

function historyHtml(){

  const done=all.filter(x=>x.st==="played").sort((a,b)=>(b.m.ts??0)-(a.m.ts??0));

  const sub=n?`Сыграно матчей: ${playedAll}. Оба прогноза угаданы в ${b} из ${n}${missed?" · без прогноза: "+missed:""}.`:"Сыгранных матчей с вашими прогнозами пока нет.";
  let html=head+sum+`<p class="note">${sub}</p>`;

  return html;
}

  if(tab==="rules")return rulesHtml();
  if(tab==="history")return historyHtml();
  return `<div class="eyebrow">ПРОГНОЗЫ НА МАТЧИ</div><h1 class="mono">Угадай счёт</h1><p class="lead">Исход, точное число голов и призы от спонсоров.</p>`+bannerHtml()+matchesHtml();
}
function renderBody(){const el=$("body");if(el)el.innerHTML=bodyHtml()}
function render(soft){
  if(soft&&$("body")){
    // мягкое обновление: меняем только то, что видно, и сохраняем прокрутку
    const y=scrollY;
    $("hdr").innerHTML=headerHtml();renderBody();scrollTo(0,y);
    return;
  }
  root.innerHTML=`<div class="top" id="hdr">${headerHtml()}</div><main class="main" id="body">${bodyHtml()}</main>`+navHtml();
}

// ---------- действия ----------
function toast(text,bad){
  document.querySelectorAll(".toast").forEach(n=>n.remove());
  const t=document.createElement("div");t.className="toast"+(bad?" err":"");t.setAttribute("role","status");t.textContent=text;document.body.appendChild(t);
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2800);
}
function enqueue(id,job){queue[id]=(queue[id]||Promise.resolve()).then(job,job)}
function setPick(id,field,value){
  if(ov.auth!=="ok"||!ov.registered){
    haptic("warning");toast(ov.auth==="none"?"Откройте приложение в Telegram, чтобы делать прогнозы":ov.auth==="ok"?"Сначала нажмите «Участвовать»":errText({code:ov.auth}),true);
    if(ov.auth==="ok")scrollTo({top:0,behavior:"smooth"});
    return;
  }
  const m=list.find(x=>x.id===id);
  if(!m||stateOf(m)!=="open"){toast(ERR.closed,true);haptic("error");syncAll().then(()=>render(true)).catch(()=>{});return}
  const cur=ov.picks[id]||{o:null,t:null},prev=cur[field];
  if(prev===value)return;
  ov.picks[id]={...cur,[field]:value};status[id]="saving";updateCard(id);haptic("select");
  enqueue(id,async()=>{
    try{
      const r=await rpc("pp_pick",{p_init:INIT,p_match:id,p_outcome:field==="o"?value:null,p_total:field==="t"?value:null});
      ov.picks[id]={...ov.picks[id],o:r.o,t:r.t,at:r.at};status[id]="saved";haptic("success");
    }catch(e){
      const p={...(ov.picks[id]||{}),[field]:prev};
      if(p.o==null&&p.t==null)delete ov.picks[id];else ov.picks[id]=p;
      status[id]="bad";haptic("error");toast(errText(e),true);
      if(e.code==="closed"||e.code==="no_match")syncAll().then(()=>render(true)).catch(()=>{});
    }
    updateCard(id);
  });
}
async function register(){
  if(!INIT)return;
  const btn=root.querySelector('[data-act="register"]');if(btn)btn.disabled=true;
  try{
    applyOverview(await rpc("pp_register",{p_init:INIT}));
    haptic("success");toast("Вы в игре! Делайте прогнозы");
    loadBoard();render();
  }catch(e){
    haptic("error");toast(errText(e),true);if(btn)btn.disabled=false;
  }
}
root.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el||el.disabled)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(a==="tab"){tab=v;haptic("select");render();scrollTo(0,0);if(v==="board")loadBoard();return}
  if(a==="filter"){filter=v;haptic("select");renderBody();return}
  if(a==="o")return setPick(el.dataset.id,"o",v);
  if(a==="t")return setPick(el.dataset.id,"t",Number(v));
  if(a==="register")return register();
  if(a==="goto"||a==="edit"){
    haptic("select");
    if(a==="goto"){filter="soon";renderBody()}else{tab="matches";filter="mine";render()}
    const card=root.querySelector(`[data-mid="${CSS.escape(el.dataset.id)}"]`);
    if(card)card.scrollIntoView({block:"center"});else scrollTo(0,0);
    return;
  }
  if(a==="retry"){fatal="";render();boot();return}
  if(a==="share"){
    const url="https://t.me/share/url?url="+encodeURIComponent(APP_LINK)+"&text="+encodeURIComponent("Пиалиста — прогнозы на Пиала Cup II. Присоединяйся и выигрывай призы от спонсоров!");
    if(TG&&TG.openTelegramLink)tgTry(()=>TG.openTelegramLink(url));else window.open(url,"_blank");
  }
});
// обратный отсчёт: обновляем подписи; когда матч начался — перерисовываем карточку
setInterval(()=>{
  if(!sched)return;
  const s=list.map(m=>stateOf(m)).join();
  const busy=Object.values(status).includes("saving");
  if(stSig&&s!==stSig&&!busy){stSig=s;render(true);return}   // матч перешёл в новое состояние (приём закрыт / начался)
  stSig=s;
  document.querySelectorAll("[data-closes]").forEach(el=>{
    const card=el.closest("article[data-mid]"),m=card&&list.find(x=>x.id===card.dataset.mid);
    if(m)el.textContent=closeText(m);
  });
},15000);

boot();
})();
</script>
</body>
